name: Release

# A Composer package is "published" by tagging the repo; Packagist serves the
# new version from the git tag. This workflow gates the tag on a green test
# run and (if a Packagist API token is configured) pings Packagist to refresh
# immediately instead of waiting for its crawler.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, hash
          coverage: none
          tools: composer:v2

      - name: Verify tag is semantic version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "${PACKAGIST_API_TOKEN}" ]; then
            echo "PACKAGIST_API_TOKEN not set — skipping Packagist refresh."
            echo "Configure the GitHub service hook on Packagist, or set the secret."
            exit 0
          fi
          curl -fsS -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/plaidly/plaidly-php"}}'
